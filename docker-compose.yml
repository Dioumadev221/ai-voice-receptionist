services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://voice:voice@db:5432/voice
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
