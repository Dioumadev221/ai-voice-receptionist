# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: voice-receptionist
    runtime: docker
    plan: starter          # free plan sleeps after 15 min idle, too slow to answer a live call
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: voice-db, property: connectionString }
      - key: VAPI_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JOBS_TOKEN
        generateValue: true
      - { key: CLINIC_NAME, value: BrightSmile Dental }
      - { key: CLINIC_TIMEZONE, value: America/New_York }
      - { key: CLINIC_PHONE, sync: false }
      - { key: VAPI_PUBLIC_KEY, sync: false }
      - { key: VAPI_ASSISTANT_ID, sync: false }
      - { key: STAFF_ALERT_PHONE, sync: false }
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: TWILIO_FROM_NUMBER, sync: false }
      - { key: GOOGLE_CALENDAR_ID, sync: false }
      - { key: GOOGLE_SERVICE_ACCOUNT_JSON, sync: false }

  - type: cron
    name: voice-reminders
    runtime: docker
    plan: starter
    schedule: "0 * * * *"   # hourly: text patients 24h before their visit
    dockerCommand: python -c "import os,urllib.request as u;r=u.Request(os.environ['APP_URL']+'/jobs/reminders',method='POST',headers={'Authorization':'Bearer '+os.environ['JOBS_TOKEN']});print(u.urlopen(r).read())"
    envVars:
      - { key: APP_URL, sync: false }
      - key: JOBS_TOKEN
        fromService: { type: web, name: voice-receptionist, envVarKey: JOBS_TOKEN }

databases:
  - name: voice-db
    plan: basic-256mb
